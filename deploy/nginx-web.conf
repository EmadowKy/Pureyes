# Include inside the existing documentation server block.
# /var/www/web points to the current frontend release; / remains documentation.
location = /web {
    return 308 /web/;
}

location ^~ /web/assets/ {
    root /var/www;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    gzip on;
    gzip_types text/css application/javascript text/javascript;
    gzip_vary on;
}

location ^~ /web/ {
    root /var/www;
    try_files $uri $uri/ /web/index.html;
    add_header Cache-Control "no-cache";
}
